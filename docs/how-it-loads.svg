<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#8b949e" stroke-width="2" marker-end="url(#arw)">
    <line x1="280" y1="74"  x2="280" y2="96"/>
    <line x1="280" y1="160" x2="280" y2="182"/>
    <line x1="280" y1="246" x2="280" y2="268"/>
    <line x1="280" y1="332" x2="280" y2="354"/>
  </g>

  <!-- 1: proxy -->
  <g>
    <rect x="120" y="20" width="320" height="54" rx="8" fill="#57606a"/>
    <text x="280" y="43" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">dwmapi.dll (proxy)</text>
    <text x="280" y="62" text-anchor="middle" fill="#e6edf3" font-size="12">Forwards exports, side-loads every mods\*.dll</text>
  </g>

  <!-- 2: dll -->
  <g>
    <rect x="120" y="106" width="320" height="54" rx="8" fill="#1f6feb"/>
    <text x="280" y="129" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">mods\huragok.dll</text>
    <text x="280" y="148" text-anchor="middle" fill="#dbeafe" font-size="12">DllMain spawns a worker thread</text>
  </g>

  <!-- 3: worker -->
  <g>
    <rect x="120" y="192" width="320" height="54" rx="8" fill="#1a7f37"/>
    <text x="280" y="215" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Worker thread</text>
    <text x="280" y="234" text-anchor="middle" fill="#dcffe4" font-size="12">Resolve base+RVA, wait for the UObject world</text>
  </g>

  <!-- 4: hooks -->
  <g>
    <rect x="120" y="278" width="320" height="54" rx="8" fill="#8250df"/>
    <text x="280" y="301" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Install hooks</text>
    <text x="280" y="320" text-anchor="middle" fill="#eee3ff" font-size="12">ProcessEvent (PC + camera), DrawControls pointer</text>
  </g>

  <!-- 5: features -->
  <g>
    <rect x="120" y="364" width="320" height="54" rx="8" fill="#bc4c00"/>
    <text x="280" y="387" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Features</text>
    <text x="280" y="406" text-anchor="middle" fill="#ffe7d6" font-size="12">Free-cam, ImGui panel, commands, keyframe paths</text>
  </g>
</svg>
