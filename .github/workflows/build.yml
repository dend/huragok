name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so build.rs can derive the version from the commit count.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload huragok.dll
        uses: actions/upload-artifact@v4
        with:
          name: huragok
          path: target/release/huragok.dll
          if-no-files-found: error
