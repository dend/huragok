name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history so build.rs can derive the version from the commit count.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$version' does not look like <major>.<minor>.<patch>."
          }
          "HURAGOK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $staging = "artifacts/huragok"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/release/huragok.dll" $staging
          Copy-Item "install.ps1" $staging
          Copy-Item "README.md" $staging
          Copy-Item "CHANGELOG.md" $staging
          Compress-Archive -Path $staging -DestinationPath "artifacts/huragok-$env:HURAGOK_VERSION.zip"

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($env:HURAGOK_VERSION)
          $pattern = "(?ms)^## \[$escaped\][^\n]*\n(.*?)(?=\n## \[|\n\[[^\]]+\]:|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            throw "CHANGELOG.md has no populated section for version $env:HURAGOK_VERSION. Add one before tagging."
          }
          Set-Content -Path "artifacts/release-notes.md" -Value $match.Groups[1].Value.Trim() -Encoding utf8

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/huragok-$env:HURAGOK_VERSION.zip" `
            --title "Huragok $env:HURAGOK_VERSION" `
            --notes-file "artifacts/release-notes.md"
